<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achados e Perdidos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appMessage" class="app-message" aria-live="polite"></div>

  <section id="screenLogin" class="screen active">
    <div class="login-container">
      <div class="brand">
        <img src="aepLogo.png" alt="Logo da aplicação Achados e Perdidos" onerror="this.src='https://via.placeholder.com/48'" />
        <h1>Achados &amp; Perdidos</h1>
        <p id="subtitulo">Selecione o tipo de acesso</p>
      </div>

      <div class="type-selector" aria-label="Seleção de tipo de acesso">
        <button type="button" class="type-btn active" id="btnTipoUser">Usuário</button>
        <button type="button" class="type-btn" id="btnTipoAdmin">Administrador</button>
      </div>

      <form id="formUser" novalidate>
        <div class="form-group">
          <label for="userEmail">E-mail ou Matrícula</label>
          <input type="text" id="userEmail" required placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label for="userSenha">Senha</label>
          <input type="password" id="userSenha" required placeholder="******" />
        </div>
        <button type="submit" class="btn-submit">Entrar no Mural</button>
      </form>

      <form id="formAdmin" novalidate style="display: none;">
        <div class="form-group">
          <label for="adminUser">Usuário Administrador</label>
          <input type="text" id="adminUser" required placeholder="admin" />
        </div>
        <div class="form-group">
          <label for="adminSenha">Senha de Acesso</label>
          <input type="password" id="adminSenha" required placeholder="******" />
        </div>
        <button type="submit" class="btn-submit btn-admin">Acessar Painel Admin</button>
      </form>
    </div>
  </section>

  <section id="screenMural" class="screen">
    <header>
      <div class="logo-container">
        <img src="aepLogo.png" alt="Logo da aplicação Achados e Perdidos" onerror="this.src='https://via.placeholder.com/40'" />
        <h1>Achados &amp; Perdidos</h1>
      </div>
      <nav class="main-nav" aria-label="Navegação do mural">
        <button type="button" class="nav-link" data-action="logout">Sair</button>
        <button type="button" class="nav-link active" data-action="mural" aria-current="page">Mural de Itens</button>
        <button type="button" class="nav-link" id="navAdminLink" data-action="admin" style="display: none;">Painel Admin</button>
      </nav>
    </header>

    <main>
      <div class="user-profile">
        <img src="avatar.jpg" alt="Avatar do usuário" onerror="this.src='https://via.placeholder.com/50'" />
        <div>
          <h3 id="userNameDisplay">Usuário Visitante</h3>
          <p>Consultando itens do sistema</p>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Pesquisar por objeto, local ou descrição..." />
      </div>

      <div class="items-grid" id="muralGrid"></div>
    </main>
  </section>

  <section id="screenAdmin" class="screen">
    <header>
      <div class="logo-container">
        <img src="aepLogo.png" alt="Logo da aplicação Achados e Perdidos" onerror="this.src='https://via.placeholder.com/40'" />
        <h1>Achados &amp; Perdidos</h1>
      </div>
      <nav class="main-nav" aria-label="Navegação do painel administrativo">
        <button type="button" class="nav-link" data-action="logout">Sair</button>
        <button type="button" class="nav-link" data-action="mural">Mural de Itens</button>
        <button type="button" class="nav-link active" aria-current="page">Painel Admin</button>
      </nav>
    </header>

    <main>
      <div class="grid-admin">
        <div class="card">
          <h2>Cadastrar Item</h2>
          <form id="itemForm" novalidate>
            <div class="form-group">
              <label for="titulo">Título do Objeto</label>
              <input type="text" id="titulo" required placeholder="Ex: Carteira de Identidade" />
            </div>
            <div class="form-group">
              <label for="status">Situação</label>
              <select id="status" required>
                <option value="achado">Achado</option>
                <option value="perdido">Perdido</option>
              </select>
            </div>
            <div class="form-group">
              <label for="local">Local</label>
              <input type="text" id="local" required placeholder="Ex: Auditório" />
            </div>
            <div class="form-group">
              <label for="data">Data</label>
              <input type="date" id="data" required />
            </div>
            <div class="form-group">
              <label for="desc">Descrição</label>
              <textarea id="desc" rows="3" placeholder="Detalhes do item..."></textarea>
            </div>
            <button type="submit" class="btn">Salvar Item</button>
          </form>
        </div>

        <div class="card">
          <h2>Itens Recentemente Cadastrados</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Status</th>
                  <th>Data</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="adminTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </section>

  <script src="script.js"></script>
</body>
</html>
